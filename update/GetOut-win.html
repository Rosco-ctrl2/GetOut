<style>
:root{
  --bg:#121418; --panel:#1b1e24; --panel2:#23272f; --line:#2f343d; --txt:#eef0f3; --mut:#9aa1ad;
  --acc:#ff8a1f; --acc2:#ffb15c; --ok:#3ccf8e; --bad:#ff5a5f;
  --case:#17181b; --liner:#c2185b; --liner2:#8e0f42; --tag:#e7ff3c;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}

/* header */
.hdr{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.hdr h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mut);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.busy i{background:var(--acc);animation:blink 1s infinite}
.sync.loc i{background:#6c8cff}
@keyframes blink{50%{opacity:.25}}
.ibtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0}
.ibtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 14px 8px}
.stat span{display:block;line-height:1.15;font-size:10.5px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px}
.stat b{display:block;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.stat.main b{color:var(--acc)}

/* search */
.search{position:relative;padding:0 14px 8px;z-index:30}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);
  padding:0 38px 0 38px;outline:none;font-size:16px}
.search input:focus{border-color:var(--acc)}
.search .mag{position:absolute;left:26px;top:11px;width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:2}
.search .clr{position:absolute;right:20px;top:5px;width:32px;height:32px;border:0;background:none;color:var(--mut);font-size:20px;display:none}
.search.multi .clr{right:56px}
.search.multi input{padding-right:92px}
.qscope{display:none;position:absolute;right:19px;top:4px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--mut);padding:0;place-items:center}
.search.multi .qscope{display:grid}
.qscope svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.qscope.on{background:#3d8bfd22;border-color:#3d8bfd;color:#8fb8ff}
.qcases{display:none;position:absolute;right:14px;top:46px;z-index:35;width:min(300px,calc(100vw - 28px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px #000c;padding:6px}
.qcases.on{display:block}
.search.has .clr{display:block}
.results{position:absolute;left:14px;right:14px;top:46px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  max-height:52vh;overflow:auto;box-shadow:0 16px 40px #000a;display:none}
.results.on{display:block}
.res{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.res:last-child{border-bottom:0}
.res:active{background:var(--panel2)}
.res .nm{flex:1;min-width:0}
.res .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .nm small{color:var(--mut);font-size:12px}
.res mark{background:none;color:var(--acc2);font-weight:700}
.qty{font-variant-numeric:tabular-nums;font-weight:700;min-width:44px;text-align:right}
.qty.zero{color:var(--bad)}
.chip{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.noresults{padding:14px;color:var(--mut);text-align:center}

/* 3D stage */
.stage{position:relative;flex:none;height:min(44vh,400px);margin:0 10px;border-radius:18px;overflow:hidden;touch-action:none;
  background:radial-gradient(120% 90% at 50% 20%,#2a2f39 0%,#16191e 70%);border:1px solid var(--line);perspective:1000px;perspective-origin:50% 40%;user-select:none;-webkit-user-select:none}
.world{position:absolute;left:50%;top:60%;width:360px;height:240px;transform-style:preserve-3d;transform-origin:180px 120px 0}
.world{transition:top .35s ease}
.world.anim{transition:transform .65s cubic-bezier(.2,.8,.2,1),top .35s ease}
.stage.up .world{top:34%}
.world *{transform-style:preserve-3d}
.f{position:absolute;left:0;top:0;transform-origin:0 0;backface-visibility:visible}
.floor{background:#0f1012}
.wall{background:linear-gradient(#26282c,#141518);border:1px solid #33363c}
.wall.front{background:linear-gradient(#2a2c31,#121316)}
.wall.liner{background:linear-gradient(#d81b60,#8e0f42);border:1px solid #6e0c33}
.div{background:linear-gradient(#e0306f,#a0124c);border:1px solid #6e0c33;border-radius:3px}
.tile{border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  font-size:14px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;cursor:pointer;overflow:hidden;padding:2px}
.tile small{font-weight:600;font-size:11px;opacity:.9}
.tile.sel{outline:3px solid var(--acc);outline-offset:-3px;animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{filter:brightness(1.6)}}
.tile.dim{filter:saturate(.3) brightness(.6)}
.lidpanel{background:linear-gradient(135deg,#1e2023,#121315);border:2px solid #2d3035}
.lidin{background:#0c0d0f}
.lidrim{background:#1b1c1f;border:1px solid #33363c}
.blue{background:#1e6fd9}
.pocketrim{background:#111214;border-top:3px solid #e0306f}
.latch{background:linear-gradient(#2b2d31,#0d0e10);border:1px solid #44474d;border-radius:3px}
.handle{background:#0d0e10;border:2px solid #3a3d42;border-radius:8px}
.ftag{background:var(--tag);color:#111;font-weight:800;font-size:12px;padding:1px 6px;border-radius:2px;text-shadow:none;margin-top:3px}
.tile.base{background:linear-gradient(160deg,#d81b60,#9c1150)!important}
.tile.pouch{background:repeating-linear-gradient(45deg,#1a1b1e 0 3px,#26282c 3px 6px)!important;border:2px solid #e0306f;border-radius:6px}
.tile.velcro{background:#141517!important;border:1px solid #333;border-radius:4px}
.tile.panel{background:#0e0f11!important;border:1px dashed #3a3d42}
.tile.strip{background:linear-gradient(90deg,#1a1b1d,#2a2c30)!important;border:1px solid #1e6fd9;border-radius:4px}
.tile .pill{display:inline-block;padding:1px 6px;border-radius:6px;color:#fff;font-size:13px}

.wall{background:repeating-linear-gradient(90deg,#1a1b1e 0 22px,#23252a 22px 25px,#141518 25px 27px)!important;border:1px solid #2b2d32}
.wall.front{background:linear-gradient(#26282c,#121316)!important}
.wall.liner{background:radial-gradient(120% 90% at 50% 0%,#e0306f,#8e0f42)!important;border:1px solid #5e0a2c;box-shadow:inset 0 -14px 18px rgba(0,0,0,.35)}
.rim{background:#202125;border-top:1px solid #3a3c41}
.handlebar{background:linear-gradient(#2c2d31,#0f1012);border-radius:6px;border:1px solid #3a3c41}
.wheel{background:radial-gradient(circle,#555 0 18%,#151515 20% 62%,#2a2a2a 64%);border-radius:50%}
.tile.base{background:radial-gradient(140% 100% at 50% 20%,#d61f65,#9a1250 70%,#7c0d40)!important;box-shadow:inset 0 0 22px rgba(0,0,0,.45);justify-content:flex-start;padding-top:5px}
.tile.base::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 2px,transparent 2px 5px);pointer-events:none}
.flab{font-size:10px;font-weight:700;background:#0008;padding:2px 7px;border-radius:8px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.flab i{width:7px;height:7px;border-radius:2px;display:inline-block}
.obj{backface-visibility:visible}
.obj.top{overflow:hidden}
.obj.soft{border-radius:7px}
.obj.top.soft{border-radius:10px;box-shadow:inset 0 3px 6px rgba(255,255,255,.12),inset 0 -6px 10px rgba(0,0,0,.35)}
.obj.dim,.f.dim{filter:brightness(.5) saturate(.6)}
.obj.hot{outline:2px solid var(--acc);outline-offset:-1px;filter:brightness(1.25)}
.obj.div{border-radius:2px}
.zip{position:absolute;left:8%;right:8%;top:46%;height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,#111 0 2px,#9a9da3 2px 4px)}
.pull{position:absolute;right:9%;top:40%;width:7px;height:13px;border-radius:2px;background:linear-gradient(#ddd,#888)}
.tagy{position:absolute;left:30%;top:14%;background:var(--tag);color:#111;font-size:9px;padding:1px 4px;border-radius:2px}
.ctag{position:absolute;width:10px;height:5px;border-radius:1px}
.keys{position:absolute;inset:10%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);gap:12%}
.keys i{background:linear-gradient(145deg,#3a3c41,#1d1e21);border-radius:2px;box-shadow:0 0 3px rgba(80,160,255,.35)}
.stk{position:absolute;opacity:.92}
.knob{position:absolute;width:20%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#888,#222)}
.fsw{position:absolute;left:38%;top:58%;width:24%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f2f2f2,#7a7d82)}
.led{position:absolute;left:46%;top:42%;width:8%;aspect-ratio:1;border-radius:50%;background:#2e9e57;box-shadow:0 0 4px #2e9e57}
.lcd{position:absolute;left:14%;right:14%;top:12%;height:30%;background:linear-gradient(#20323a,#0e1a1f);border-radius:2px;box-shadow:inset 0 0 4px #3de0c4}
.socks{position:absolute;inset:4px;display:flex;justify-content:space-around;align-items:center}
.sock{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#1e6fd9 0 30%,#0a0a0a 32% 60%,#2a2b2f 62%)}

.pin .lab{background:var(--acc);color:#1a0f00;font-weight:800;font-size:12px;padding:4px 9px;border-radius:10px;white-space:nowrap;box-shadow:0 6px 18px #0009;max-width:190px;overflow:hidden;text-overflow:ellipsis}

.ctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:5}

.ctl svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.views{position:absolute;left:8px;top:8px;display:flex;gap:5px;z-index:5}
.views button{display:flex;align-items:center;gap:5px;height:34px;padding:0 9px 0 7px;border-radius:10px;border:1px solid #ffffff22;background:#0b0c0fb3;color:#ffffffcc;font-size:11.5px;font-weight:700;letter-spacing:.5px;backdrop-filter:blur(6px)}

.sticker{overflow:visible}
.stk{position:absolute;inset:0;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.skwrap{display:flex;justify-content:center;margin:0 0 10px}
.skface{position:relative;border:2px solid #2b2d32;overflow:hidden;touch-action:none;box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
.skit{position:absolute;cursor:grab;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.skit.on{outline:2px dashed var(--acc);outline-offset:2px}
.skempty{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#ffffff66;pointer-events:none}
.skpal{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-bottom:6px}
.skpal button{height:62px;border-radius:10px;border:1px solid var(--line);background:#2a2c31;padding:6px}
.skpal i{display:block;width:100%;height:100%}
.stripface{overflow:visible;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 -2px 3px rgba(0,0,0,.6)}
.sock{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 45%,#141416 0 55%,#0a0a0b 60%,#2b2c30 74%,#08080a 80%);box-shadow:inset 0 2px 3px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.08)}
.sock .pin{position:absolute;top:44%;width:16%;height:16%;border-radius:50%;background:radial-gradient(circle,#2a0606 0 40%,#7a1a12 70%)}
.sock .gnd{position:absolute;left:41%;width:18%;height:14%;border-radius:2px;background:linear-gradient(#f3cf6b,#b98a1f);box-shadow:0 0 1px #000}
.stripcap{position:absolute;border-radius:2px;background:rgba(255,255,255,.12)}
.striplab{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%) scaleY(-1);white-space:nowrap;font-size:9px;font-weight:800;color:#fff;padding:1px 5px;border-radius:5px;opacity:.9}
.acgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:2px 0 6px}
.acgrid button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:12px;font-weight:600;line-height:1.15;text-align:center}
.acgrid button b{font-size:20px;line-height:1}
.acgrid button small{font-size:10px;color:var(--mut);font-weight:500}
.acgrid button:hover{border-color:var(--acc)}
.sheet .acgrid{grid-template-columns:1fr 1fr}
.sheet .acgrid button{padding:14px 6px;font-size:14px}
.elb{position:absolute;background:linear-gradient(180deg,#3a3c42,#1b1c20 60%,#2a2c31);box-shadow:0 1px 2px rgba(0,0,0,.6);border-radius:2px}
.decoimg{position:absolute;inset:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.tile.deco{overflow:visible}
.cuth{position:absolute;background:rgba(0,0,0,.6);box-shadow:inset 0 2px 4px rgba(0,0,0,.7)}
.ledstrip{border-radius:3px}
.ledstrip.rgb,.ledglow.rgb{animation:ledrgb 4s linear infinite}
@keyframes ledrgb{to{filter:hue-rotate(360deg)}}
.ledglow{pointer-events:none}
#btnLed.on{background:#ffd166;color:#111;border-color:#ffd166;box-shadow:0 0 14px #ffd16699}
.ledpal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ledpal button{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:13px;text-align:left}
.ledpal button.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.ledpal i{width:28px;height:14px;border-radius:4px;flex:none;box-shadow:0 0 8px rgba(255,255,255,.3)}
.flap.fab{border-top:2px solid rgba(0,0,0,.35);box-shadow:inset 0 3px 4px rgba(255,255,255,.08)}
.oc.k-fabric{background:linear-gradient(#9aa0a8,#7c828a);border-color:#5f656e}

.dfront{display:flex;align-items:center;justify-content:center;border-radius:3px}
.dfin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.dhandle{display:block;width:110px;height:9px;border-radius:5px;box-shadow:0 2px 3px rgba(0,0,0,.6)}

.oc.k-foam{background:radial-gradient(circle at 2px 2px,rgba(0,0,0,.3) 1px,transparent 1.6px) 0 0/5px 5px,#3a3c41;border-color:#5b5e66}
.oc.k-bag{background:radial-gradient(120% 120% at 50% 30%,#3a3d44,#22242a 70%);border-radius:12px}
.swrow{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.swrow .lbl{width:100%;font-size:12px;color:var(--mut)}
.swrow button{width:28px;height:28px;border-radius:8px;border:2px solid #ffffff22;padding:0}
.swrow button.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.swrow input[type=color]{width:34px;height:30px;border:0;background:none;padding:0}
.swrow .auto{width:auto!important;padding:0 8px!important;font-size:12px;color:var(--txt);background:var(--panel2)}
.models{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.models label{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);text-align:center;cursor:pointer}
.models label input{display:none}
.models label.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.models svg{width:44px;height:44px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.models b{font-size:13px}.models small{font-size:11px;color:var(--mut);line-height:1.2}
.hint{position:absolute;left:10px;bottom:8px;font-size:11px;color:#ffffff88;pointer-events:none}

/* list */
.seg{display:flex;gap:6px;padding:10px 14px 6px}
.seg button{flex:1;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font-weight:600;font-size:14px}
.seg button.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.list{flex:1;overflow:auto;padding:4px 14px calc(96px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.zone{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:12px 2px 6px;display:flex;justify-content:space-between}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}

.chead b{flex:1}
.chead .cnt{color:var(--mut);font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row.sel{background:#ff8a1f1a}
.row .nm{flex:1;min-width:0}

.empty{color:var(--mut);font-size:13px;padding:9px 12px;border-top:1px solid var(--line)}
.banner{background:#ff8a1f14;border:1px solid #ff8a1f55;border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;margin-top:6px}
.banner button{white-space:nowrap}

.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;border:0;background:var(--acc);color:#1a0f00;
  font-size:32px;font-weight:300;box-shadow:0 10px 26px #ff8a1f55;z-index:40;display:grid;place-items:center}

/* sheet */
.scrim{position:fixed;inset:0;background:#0007;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.scrim.clear{background:transparent}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  max-height:78dvh;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  padding:8px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px #000a}
.sheet.on{transform:none}
.sheet.short{max-height:52dvh}
.grab{width:40px;height:5px;border-radius:3px;background:#555;margin:2px auto 10px}
.sh{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.sh h2{margin:0;font-size:20px;flex:1;line-height:1.2}

.big{display:flex;align-items:center;gap:14px;margin:6px 0 12px}
.stp{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-size:26px}
.big .n{flex:1;text-align:center}
.big .n b{font-size:40px;font-variant-numeric:tabular-nums;display:block;line-height:1}
.big .n span{font-size:12px;color:var(--mut)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-bottom:12px}
.kv dt{color:var(--mut)} .kv dd{margin:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:600;padding:0 14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1a0f00}
.btn.dng{color:var(--bad);border-color:#ff5a5f55;background:#ff5a5f12}
label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:12px;color:var(--mut);margin:0 0 4px 2px}
.fld input,.fld select,.fld textarea{width:100%;min-height:44px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);padding:9px 12px;outline:none;font-size:16px}
.fld textarea{min-height:70px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.err{color:var(--bad);font-size:13px;margin:-2px 0 10px;min-height:1px}
.note{color:var(--mut);font-size:13px;margin:0 0 10px}
.mini{width:100%;display:block;margin:4px 0 12px;border-radius:10px;background:#0d0f12;border:1px solid var(--line)}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:16px 2px 8px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-80px);background:#000d;border:1px solid var(--line);
  padding:8px 14px;border-radius:12px;font-size:13px;z-index:90;transition:transform .25s}
.toast.on{transform:translate(-50%,0)}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.colors button{width:30px;height:30px;border-radius:9px;border:2px solid transparent}
.colors button.on{border-color:#fff}

/* ---------- desktop (Windows) layout ---------- */
@media (min-width:900px){
  body{font-size:15px}
  #app{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(380px,1fr);grid-template-rows:auto auto auto auto auto minmax(0,1fr);
    grid-template-areas:"stage hdr" "stage modes" "stage stats" "stage search" "stage seg" "stage list";padding:10px 10px 0 0}
  .hdr{grid-area:hdr} .modes{grid-area:modes} .stats{grid-area:stats} .search{grid-area:search} .seg{grid-area:seg} .list{grid-area:list;padding-bottom:96px}
  .stage{grid-area:stage;height:auto;margin:0 10px 10px 10px;border-radius:20px}
  .stage.up .world{top:64%}
  .world{top:64%}
  .sheet{left:auto;right:16px;bottom:16px;width:min(560px,44vw);border-radius:20px;border:1px solid var(--line);max-height:calc(100vh - 32px)}
  .sheet.short{max-height:calc(100vh - 32px)}
  .scrim.clear{display:none}
  .fab{right:24px;bottom:24px}
  .results{max-height:60vh}
  .hint{font-size:12px}
  .row:hover,.chead:hover{background:#ffffff08}
  .cb:hover{border-color:var(--acc)}
  ::-webkit-scrollbar{width:10px} ::-webkit-scrollbar-thumb{background:#2f343d;border-radius:6px}
}
</style>

function toStore(x){
  if(!x) return null;
  if(x.cases && x.cases.length) return x;
  if(x.compartments){ if(!x.id) x.id='v1'; return {v:2,cur:x.id,updated:x.updated||0,cases:[x]}; }
  return null;
}
function fixStore(s){
  s.cases.forEach(function(c){ c.items=c.items||[]; c.compartments=c.compartments||[]; if(!c.id) c.id=uid('v'); if(!c.name) c.name='Valigia'; });
  if(!s.cases.some(function(c){return c.id===s.cur;})) s.cur=s.cases[0].id;
  return s;
}
function loadStore(){
  var emb=null, loc=null;
  try{ emb=toStore(JSON.parse(document.getElementById('data').textContent)); }catch(e){}

  var st=emb;
  if(loc && (!st || (loc.updated||0)>(st.updated||0))){ st=loc; if(emb) dirty=true; }
  if(!st) st=toStore(firstCase());

}

function edgeHit(el,e){ var r=el.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top, m=Math.max(6,Math.min(14,r.width/4,r.height/4));

function comp(id){for(var i=0;i<data.compartments.length;i++) if(data.compartments[i].id===id) return data.compartments[i]; return null;}

function descendants(id,g){g=g||0; if(g>8) return []; var out=[]; kids(id).forEach(function(k){out.push(k); out=out.concat(descendants(k.id,g+1));}); return out;}
function topIn(cid){return data.items.filter(function(i){return i.comp===cid && !(i.parent && item(i.parent));});}

function chain(i){var out=[], g=0, p=i&&i.parent?item(i.parent):null; while(p && g++<10){ out.unshift(p); p=p.parent?item(p.parent):null; } return out;}

function busyUI(){
  var a=document.activeElement;
  return (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) || $('sheet').dataset.form==='1' || dragging;
}
function schedulePublish(){
  if(!artifactNS){ setSync('ok','Salvato su questo PC'); return; }
  setSync('busy','Da salvare');
  clearTimeout(pubTimer);
  pubTimer=setTimeout(doPublish,2200);
}
function doPublish(){
  if(!artifactNS||!dirty) return;
  if(busyUI()){ pubTimer=setTimeout(doPublish,1500); return; }
  setSync('busy','Salvataggio…');
  try{sessionStorage.setItem('valigia-ui',JSON.stringify({cam:cam,lidOpen:lidOpen,tab:tab,sel:sel}));}catch(e){}
  Promise.resolve().then(function(){return artifactNS.publish(buildDoc());}).then(function(){
    dirty=false; setSync('ok','Salvato');
  }).catch(function(e){
    var m=String(e&&(e.code||e.message)||e);
    if(/not_granted|not_writer/.test(m)){ artifactNS=null; setSync('loc','Su questo iPhone'); }
    else if(/conflict/.test(m)){ setSync('busy','Aggiornato altrove'); }
    else { setSync('loc','Non salvato online'); }
  });
}
function initCloud(){
  setSync('ok','Offline · su questo PC');

  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  setTimeout(welcome,400);
  return;
  try{
    if(window.claude && typeof window.claude.use==='function'){
      window.claude.use('artifact').then(function(ns){
        artifactNS=ns||null;
        if(artifactNS){ if(dirty) schedulePublish(); else setSync('ok','Salvato'); }
      }).catch(function(){});
    }
  }catch(e){}
}

    if(ok) return {x:x,y:y,w:w,h:h};

function layout(c){
  var its=topIn(c.id), out={}, n=its.length; if(!n) return out;
  var a=area(c), r=a.w/a.h;
  if(its.some(function(i){return i.pos;})){
    its.forEach(function(i){ if(i.pos) out[i.id]=clampR(i.pos,a); });
    its.forEach(function(i){ if(i.pos) return; var sz=Math.max(14,Math.min(a.w,a.h)/3);
      out[i.id]=findFree(out,a,sz,sz)||findFree(out,a,14,14)||{x:a.x,y:a.y,w:sz,h:sz}; });

function importVcfFile(f,after){
  if(!f) return; var r=new FileReader();
  r.onload=function(){ var list=parseVcf(r.result);
    if(!list.length){ toast('Nessun contatto con numero nel file'); return; }
    list.sort(function(a,b){ return a.n.localeCompare(b.n,'it'); });
    store.book=list; store.bookAt=Date.now(); save(); toast('Rubrica importata: '+list.length+' contatti'); if(after) after(); };
  r.readAsText(f);
}
function bookHint(id){
  if(typeof NATIVE!=='undefined' && NATIVE) return '';
  return '<label class="bookhint">📇 <span>'+(book().length?'Rubrica: '+book().length+' contatti · aggiorna (.vcf)':'Importa la rubrica del telefono (.vcf) per trovare i numeri mentre scrivi')+'</span><input type="file" id="'+id+'" accept=".vcf,text/vcard,text/x-vcard"></label>';
}
document.addEventListener('click',function(e){
  var b=e.target.closest && e.target.closest('[data-warub]'); if(!b) return;
  var who=b.dataset.warub, names=b.dataset.wan;
  pickContact(function(c){
    contacts()[who]=c.tels[0]; save();
    var link=waLink(who,names);
    if(typeof NATIVE!=='undefined' && NATIVE || waMode()==='app') location.href=link;
    else if(!window.open(link,'_blank')) toast('Numero di '+who+' salvato: premi di nuovo Ricordaglielo');
  });
});
function editPhone(who,after){
  sheet('<div class="sh"><h2>Modifica contatto</h2><button class="x" data-close>×</button></div>'+
    '<p class="note">Correggi il nome o cambia il numero quando serve: vale per tutti i prestiti di questa persona, in tutte le valigie. Senza numero, WhatsApp ti chiede a chi mandarlo.</p>'+
    '<div class="fld"><span class="lbl">Nome</span><div class="lnfind"><input id="phNm" value="'+esc(who)+'" autocomplete="off" autocorrect="off" spellcheck="false"><div class="lnres" id="phNmRes"></div></div>'+bookHint('phVcf')+'</div>'+
    '<div class="fld"><span class="lbl">Telefono (es. 333 1234567 oppure +41 79…)</span><div class="phrow"><input id="phN" type="tel" inputmode="tel" value="'+esc(phoneOf(who))+'" autocomplete="off">'+rubBtn('phRub')+'</div><div class="tels" id="phTels"></div></div>'+
    '<div class="err" id="phE"></div><div class="btns"><button class="btn" data-close>Annulla</button><button class="btn pri" id="phGo">Salva</button></div>',{form:true});
  wireRubrica('phRub','phN','phTels');
  nameSearch('phNm','phN','phTels');
  if($('phVcf')) $('phVcf').onchange=function(){ var lbl=this.closest('.bookhint'); importVcfFile(this.files[0],function(){ if(lbl) lbl.querySelector('span').textContent='Rubrica: '+book().length+' contatti · aggiorna (.vcf)'; }); };
  $('phGo').onclick=function(){
    var nm=$('phNm').value.trim().replace(/\s+/g,' '), v=$('phN').value.trim();
    if(!nm){ $('phE').textContent='Scrivi il nome.'; $('phNm').focus(); return; }
    if(v && !normPhone(v)){ $('phE').textContent='Numero non valido.'; $('phN').focus(); return; }
    var n=0;
    if(nm!==who){ store.cases.forEach(function(c){ c.items.forEach(function(i){ loansOf(i).forEach(function(l){ if(l.who===who){ l.who=nm; n++; } }); }); });
      delete contacts()[who]; }
    if(v) contacts()[nm]=v; else delete contacts()[nm];
    closeSheet(); save();
    toast(nm!==who?'Nome corretto: '+nm+(n>1?' ('+n+' prestiti)':''):(v?'Numero salvato':'Numero rimosso'));
    if(after) setTimeout(after,300); };
}
function returnLoan(itemId,loanId){
  var i=item(itemId); if(!i) return; var l=loansOf(i).filter(function(x){return x.id===loanId;})[0]; if(!l) return;
  i.loans=loansOf(i).filter(function(x){return x.id!==loanId;}); if(!i.loans.length) delete i.loans;
  save(); toast('Restituito da '+l.who+': '+i.name);
}
function lendForm(itemId,back){
  if(mode==='ro') setMode('edit');
  var pre=itemId?item(itemId):null, picked=pre&&!pre.container?pre.id:null;
  function avail(i){ return Math.max(0,(+i.qty||0)-lentQty(i)); }
  sheet('<div class="sh"><h2>🤝 Presta materiale</h2><button class="x" data-close>×</button></div>'+
    '<div class="fld"><span class="lbl">Cosa</span><div id="lnPick"></div>'+
      '<div class="lnfind" id="lnFindBox"><input id="lnFind" placeholder="Scrivi cosa presti… es. superlux, cavo usb, fusibile" autocomplete="off" autocorrect="off" spellcheck="false"><div class="lnres" id="lnRes"></div></div></div>'+
    '<div class="fld"><span class="lbl">A chi</span><div class="lnfind"><input id="lnWho" placeholder="Scrivi il nome… cerca anche nella rubrica" autocomplete="off" autocorrect="off" spellcheck="false"><div class="lnres" id="lnWhoRes"></div></div>'+bookHint('lnVcf')+'</div>'+
    '<div class="fld"><span class="lbl">WhatsApp / telefono (facoltativo, per “Ricordaglielo”)</span><div class="phrow"><input id="lnPhone" type="tel" inputmode="tel" placeholder="es. 333 1234567" autocomplete="off">'+rubBtn('lnRub')+'</div><div class="tels" id="lnTels"></div></div>'+
    '<div class="g2"><label class="fld"><span>Quanti</span><input id="lnQty" type="number" inputmode="numeric" min="1" value="1"></label>'+
    '<label class="fld"><span>Dal giorno</span><input id="lnDate" type="date" value="'+today()+'"></label></div>'+
    '<label class="fld"><span>Nota</span><input id="lnNote" placeholder="facoltativa, es. data concerto" autocomplete="off"></label>'+
    '<div class="err" id="lnErr"></div>'+
    '<div class="btns"><button class="btn" data-close>Annulla</button><button class="btn pri" id="lnGo">Registra prestito</button></div>',{form:true});
  function matches(v){
    var terms=norm(v).split(/\s+/).filter(Boolean); if(!terms.length) return [];
    return data.items.filter(function(i){ return !i.container; }).map(function(i){
      var nm=norm(i.name), hay=norm([i.name,i.code,i.note,locText(i)].join(' '));
      if(!terms.every(function(t){ return hay.indexOf(t)>=0; })) return null;
      var toks=nm.split(/[^a-z0-9]+/).filter(Boolean), sc=(nm.indexOf(terms[0])===0?4:0)+(norm(i.code)===terms.join(' ')?6:0)+(avail(i)>0?1:-3);
      terms.forEach(function(t){ var best=0; toks.forEach(function(k){ if(k.indexOf(t)===0) best=Math.max(best,t.length/k.length); }); sc+=best*4; });
      return {i:i,sc:sc};
    }).filter(Boolean).sort(function(x,y){ return y.sc-x.sc || x.i.name.localeCompare(y.i.name,'it'); }).slice(0,8).map(function(x){return x.i;});
  }
  function drawRes(){
    var v=$('lnFind').value, box=$('lnRes');
    if(!v.trim()){ box.innerHTML=''; box.classList.remove('on'); return; }
    var terms=norm(v).split(/\s+/), m=matches(v);
    box.innerHTML=m.length?m.map(function(i,k){ var a=avail(i), c=comp(i.comp);
      return '<button class="lnr'+(k===0?' first':'')+'" data-pick="'+i.id+'"'+(a?'':' disabled')+'><span class="dot" style="background:'+(c?c.color:'#666')+'"></span>'+
        '<span class="nm"><b>'+hl(i.name,terms)+'</b><small>'+(i.code?hl(i.code,terms)+' · ':'')+esc(locText(i))+'</small></span>'+
        '<span class="av'+(a?'':' zero')+'">'+(a?fmt(a)+' disp.':'tutti fuori')+'</span></button>'; }).join('')
      :'<div class="noresults">Nessun materiale con “'+esc(v)+'”</div>';
    box.classList.add('on');
  }
  function drawPick(){
    var i=item(picked);
    $('lnFindBox').style.display=i?'none':'';
    $('lnPick').innerHTML=i?'<div class="lnchip"><span class="nm"><b>'+esc(i.name)+'</b><small>'+esc(locText(i))+' · in valigia '+fmt(avail(i))+' di '+fmt(i.qty)+'</small></span><button class="btn" id="lnChange">Cambia</button></div>':'';
    if(i){ $('lnQty').max=avail(i)||1; if((+$('lnQty').value||1)>avail(i)) $('lnQty').value=Math.max(1,avail(i));
      $('lnChange').onclick=function(){ picked=null; drawPick(); $('lnFind').value=''; drawRes(); $('lnFind').focus(); }; }
  }
  function pick(id){ var i=item(id); if(!i || !avail(i)) return; picked=id; $('lnRes').classList.remove('on'); drawPick(); setTimeout(function(){ $('lnWho').focus(); },50); }
  $('lnFind').addEventListener('input',drawRes);
  function fillPhone(){ var ph=phoneOf($('lnWho').value.trim()); if(ph && !$('lnPhone').value) $('lnPhone').value=ph; }
  wireRubrica('lnRub','lnPhone','lnTels','lnWho');
  nameSearch('lnWho','lnPhone','lnTels',function(){ setTimeout(function(){ $('lnQty').focus(); },30); });
  if($('lnVcf')) $('lnVcf').onchange=function(){ var lbl=this.closest('.bookhint'); importVcfFile(this.files[0],function(){ if(lbl) lbl.querySelector('span').textContent='Rubrica: '+book().length+' contatti · aggiorna (.vcf)'; $('lnWho').dispatchEvent(new Event('input')); }); };
  $('lnWho').addEventListener('change',fillPhone); $('lnWho').addEventListener('blur',fillPhone);
  $('lnFind').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); var f=$('lnRes').querySelector('[data-pick]:not([disabled])'); if(f) pick(f.dataset.pick); } });
  $('lnRes').addEventListener('pointerdown',function(e){ e.preventDefault(); });
  $('lnRes').addEventListener('click',function(e){ var b=e.target.closest('[data-pick]'); if(b) pick(b.dataset.pick); });
  drawPick();
  setTimeout(function(){ (picked?$('lnWho'):$('lnFind')).focus(); },300);
  $('lnGo').onclick=function(){
    var i=item(picked), who=$('lnWho').value.trim(), q=parseInt($('lnQty').value,10)||1;
    if(!i){ $('lnErr').textContent='Scrivi e scegli cosa presti.'; $('lnFind').focus(); return; }
    if(!who){ $('lnErr').textContent='Scrivi a chi lo presti.'; $('lnWho').focus(); return; }
    if(q>avail(i)){ $('lnErr').textContent='In valigia ne restano '+fmt(avail(i))+'.'; return; }
    var ph=$('lnPhone').value.trim(); if(ph && !normPhone(ph)){ $('lnErr').textContent='Numero di telefono non valido.'; $('lnPhone').focus(); return; }
    if(ph) contacts()[who]=ph;
    i.loans=loansOf(i).concat([{id:uid('p'),who:who,qty:q,date:$('lnDate').value||today(),note:$('lnNote').value.trim()}]);
    closeSheet(); save(); toast('Prestato a '+who+': '+q+' × '+i.name);
    setTimeout(function(){ if(back==='item') openItem(i.id); else openLoans(); },300);
  };
}
function openLoans(){
  var list=allLoans(), by={};
  list.forEach(function(x){ (by[x.l.who]=by[x.l.who]||[]).push(x); });
  var names=Object.keys(by).sort(function(a,b){return a.localeCompare(b,'it');});
  var tot=list.reduce(function(t,x){return t+(+x.l.qty||0);},0);
  sheet('<div class="sh"><h2>🤝 In prestito<div class="note" style="margin:2px 0 0">'+(list.length?fmt(tot)+' pezzi · '+names.length+' person'+(names.length===1?'a':'e'):'Niente in prestito')+'</div></h2><button class="x" data-close>×</button></div>'+
    (names.length?names.map(function(n){ var g=by[n], q=g.reduce(function(t,x){return t+(+x.l.qty||0);},0);
      return '<div class="card" style="margin-bottom:10px"><div class="chead" style="cursor:default"><span class="who">'+esc(n.charAt(0).toUpperCase())+'</span><b>'+esc(n)+'<small class="ph">'+(phoneOf(n)?esc(phoneOf(n)):'nessun numero')+'</small></b><span class="cnt">'+fmt(q)+' pz</span><button class="cgo" data-ph="'+esc(n)+'" aria-label="Modifica nome e numero di '+esc(n)+'">'+PEN+'</button></div>'+
        (g.length>1?'<div class="waall">'+waBtn(n,(function(a){ return a.length>1?a.slice(0,-1).join(', ')+' e '+a[a.length-1]:a[0]; })(g.map(function(x){return x.i.name;})))+'<small>tutto insieme</small></div>':'')+
        g.map(function(x){ return '<div class="row rs lnrow"><span class="nm"><div>'+esc(x.i.name)+(+x.l.qty>1?' <b>× '+fmt(x.l.qty)+'</b>':'')+'</div><small>'+esc(locText(x.i))+' · dal '+fmtDate(x.l.date)+' ('+loanAge(x.l.date)+')'+(x.l.note?' · '+esc(x.l.note):'')+'</small></span>'+
          '<span class="lnact">'+waBtn(n,x.i.name,true)+'<button class="btn retb" data-ret="'+x.i.id+'|'+x.l.id+'">Restituito ✓</button></span></div>'; }).join('')+'</div>'; }).join('')
      :'<p class="note">Quando presti qualcosa registralo qui: saprai sempre a chi l\'hai dato e da quanto tempo.</p>')+
    '<div class="btns" style="margin-top:6px"><button class="btn pri" id="lnNew">+ Nuovo prestito</button>'+(list.length?'<button class="btn" id="lnCopy">Copia elenco</button>':'')+'</div>',{short:true});
  $('lnNew').onclick=function(){ lendForm(null); };
  $('sheet').querySelectorAll('[data-ret]').forEach(function(b){ b.onclick=function(){ var p=b.dataset.ret.split('|'); returnLoan(p[0],p[1]); openLoans(); }; });
  $('sheet').querySelectorAll('[data-ph]').forEach(function(b){ b.onclick=function(){ editPhone(b.dataset.ph,openLoans); }; });
  if($('lnCopy')) $('lnCopy').onclick=function(){
    var txt='In prestito ('+(data.name||'Valigia')+'):\n'+names.map(function(n){ return n+':\n'+by[n].map(function(x){ return '  - '+x.i.name+(+x.l.qty>1?' × '+x.l.qty:'')+' (dal '+fmtDate(x.l.date)+')'; }).join('\n'); }).join('\n');
    copyText(txt,function(ok){ toast(ok?'Elenco copiato':'Copia non riuscita'); });
  };
}

}
/* quick actions on list rows: − / + / delete (two taps), with undo */
var undoBuf=null;
function refreshQty(i){
  [i].concat(chain(i)).forEach(function(x){
    var q=x.container?pcs(descendants(x.id)):+x.qty;
    document.querySelectorAll('[data-qty-for="'+x.id+'"]').forEach(function(e){
      if(x.container){ e.innerHTML=fmt(q)+'<small class="qs">pz</small>'; return; }
      e.textContent=fmt(q); e.className='qty'+(q?(isLow(x)?' lowq':''):' zero');
    });
  });
}
function removeItem(id){
  var i=item(id); if(!i) return;
  var snap=JSON.parse(JSON.stringify(data.items));
  kids(id).forEach(function(k){ if(i.parent) k.parent=i.parent; else delete k.parent; });
  data.items=data.items.filter(function(x){return x.id!==id;});
  if(sel.item===id) sel={item:null,comp:sel.comp};
  undoBuf=snap; save();
  toastUndo('Eliminato: '+i.name,function(){ if(undoBuf){ data.items=undoBuf; undoBuf=null; save(); toast('Ripristinato'); } });
}
function toastUndo(msg,fn){
  var t=$('toast'); t.innerHTML=esc(msg)+' <button class="undo">Annulla</button>'; t.classList.add('on');
  t.querySelector('.undo').onclick=function(){ t.classList.remove('on'); fn(); };
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('on'); undoBuf=null; },5000);
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b) return;
  e.stopPropagation(); e.preventDefault();
  if(mode==='ro') return;

function arrange(cid,focusId){

  var cur=focusId&&item(focusId)&&!item(focusId).parent?focusId:its[0].id;
  var CW=Math.min(window.innerWidth-36,520), sc=Math.min(CW/(c.w*U), 230/(c.h*U)), PW=c.w*U*sc, PH=c.h*U*sc;
  sheet('<div class="sh"><h2>Disponi · '+esc(c.label)+'<div class="note" style="margin:2px 0 0">Trascina per spostare · angolo arancione per ridimensionare</div></h2><button class="x" data-close>×</button></div>'+
    '<div class="arrwrap"><div class="arr" id="arr" style="width:'+PW+'px;height:'+PH+'px"><div class="arrarea" style="left:'+a.x*sc+'px;top:'+a.y*sc+'px;width:'+a.w*sc+'px;height:'+a.h*sc+'px"></div></div>'+
    '<div class="arrfoot">'+(isFloor(c.zone)?'▼ fronte (maniglia)':(c.kind==='pouch'?'zona a rete della tasca':'▲ alto del coperchio'))+'</div></div>'+
    '<div class="arrsel" id="arrSel"></div>'+
    '<div class="arrbar"><button class="btn" id="aRot">↻ Ruota 90°</button><button class="btn" id="aStand">⇅ In piedi</button><button class="btn" id="aSm">−</button><button class="btn" id="aBg">+</button></div>'+
    '<div class="btns"><button class="btn" id="aAuto">Disposizione automatica</button><button class="btn pri" data-close>Fine</button></div>',{short:true,clear:true,form:true});
  var arr=$('arr');
  function el(it){ return arr.querySelector('[data-aid="'+it.id+'"]'); }
  function draw(){
    arr.querySelectorAll('.ai').forEach(function(e){e.remove();});
    var Lr=layout(c);
    topIn(cid).forEach(function(it){
      var r=Lr[it.id]; if(!r) return; it.pos={x:r.x,y:r.y,w:r.w,h:r.h};
      var d=document.createElement('div'); d.className='ai'+(it.id===cur?' on':'')+(it.stand?' st':''); d.dataset.aid=it.id;
      var col=colorOf(it); d.style.cssText='left:'+r.x*sc+'px;top:'+r.y*sc+'px;width:'+r.w*sc+'px;height:'+r.h*sc+'px;background:'+col+';color:'+(/#(ec|f2|e3|cf)/i.test(col)?'#111':'#fff');
      d.innerHTML='<span>'+(it.stand?'⇅ ':'')+esc(it.name)+'</span>'+(it.id===cur?'<i class="rh"></i>':'');
      arr.appendChild(d);
    });
    var ci=item(cur); $('arrSel').innerHTML=ci?'<b>'+esc(ci.name)+'</b> · '+(ci.pos.w>=ci.pos.h?'orizzontale':'verticale')+(ci.stand?' · in piedi':' · sdraiato'):'';
    $('aStand').textContent=ci&&ci.stand?'⇅ Sdraia':'⇅ In piedi';
  }
  function live(){ sel={item:cur,comp:cid}; render3D(); }
  function commit(){ save(); }
  draw(); live(); requestAnimationFrame(function(){ focusComp(c); });
  var drag=null;
  arr.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    var d=e.target.closest('.ai');
    if(!d){ if(cur){ cur=null; draw(); live(); } return; }   /* empty space: deselect */
    e.preventDefault(); var it=item(d.dataset.aid); if(!it) return;
    var E=cur===it.id?edgeHit(d,e):{any:false}; if(e.target.closest('.rh')) E={r:true,b:true,any:true};
    if(cur!==it.id){ cur=it.id; draw(); live(); d=el(it); }
    drag={it:it,E:E,x0:e.clientX,y0:e.clientY,p0:JSON.parse(JSON.stringify(it.pos)),moved:false};
    try{ arr.setPointerCapture(e.pointerId); }catch(_){}
  });
  arr.addEventListener('pointermove',function(e){
    if(!drag){ var h=e.target.closest&&e.target.closest('.ai.on'); arr.style.cursor=h?(edgeCursor(edgeHit(h,e))||'grab'):''; return; }
    if(lostMouse(e)){ end(); return; }
    var dx=(e.clientX-drag.x0)/sc, dy=(e.clientY-drag.y0)/sc, p0=drag.p0, it=drag.it, E=drag.E;
    if(Math.abs(dx)+Math.abs(dy)>1) drag.moved=true;

    var np=E.any?{x:p0.x+(E.l?sn(dx):0),y:p0.y+(E.t?sn(dy):0),w:p0.w+(E.r?sn(dx):0)-(E.l?sn(dx):0),h:p0.h+(E.b?sn(dy):0)-(E.t?sn(dy):0)}:{x:sn(p0.x+dx),y:sn(p0.y+dy),w:p0.w,h:p0.h};
    if(np.w<8){ if(E.l) np.x=p0.x+p0.w-8; np.w=8; } if(np.h<8){ if(E.t) np.y=p0.y+p0.h-8; np.h=8; }
    it.pos=clampR(np,a); var d=el(it); if(d){ d.style.left=it.pos.x*sc+'px'; d.style.top=it.pos.y*sc+'px'; d.style.width=it.pos.w*sc+'px'; d.style.height=it.pos.h*sc+'px'; }
  });
  function end(){ if(!drag) return; var m=drag.moved; drag=null; if(m){ draw(); live(); commit(); } }
  arr.addEventListener('pointerup',end); arr.addEventListener('pointercancel',end); arr.addEventListener('lostpointercapture',end);
  $('aRot').onclick=function(){ var it=item(cur); if(!it) return; var p0=it.pos, cx=p0.x+p0.w/2, cy=p0.y+p0.h/2;
    it.pos=clampR({x:cx-p0.h/2,y:cy-p0.w/2,w:p0.h,h:p0.w},a); draw(); live(); commit(); };
  $('aStand').onclick=function(){ var it=item(cur); if(!it) return; if(it.stand) delete it.stand; else it.stand=true; draw(); live(); commit(); };
  function scaleBy(f){ var it=item(cur); if(!it) return; var p0=it.pos, cx=p0.x+p0.w/2, cy=p0.y+p0.h/2, w=p0.w*f, h=p0.h*f;
    it.pos=clampR({x:cx-w/2,y:cy-h/2,w:w,h:h},a); draw(); live(); commit(); }
  $('aSm').onclick=function(){ scaleBy(0.85); }; $('aBg').onclick=function(){ scaleBy(1.15); };
  $('aAuto').onclick=function(){ topIn(cid).forEach(function(it){ delete it.pos; delete it.stand; }); L=layout(c);
    topIn(cid).forEach(function(it){ var r=L[it.id]; it.pos={x:r.x,y:r.y,w:r.w,h:r.h}; }); draw(); live(); commit(); toast('Disposizione automatica'); };
}
/* ---------- quick insert: one line per item ---------- */
function parseLine(l){
  var name=l.trim().replace(/^[-•*·–]\s*/,''); if(!name) return null;
  var qty=null, code='', m, parts=name.split(/\s*[;|]\s*/);
  if(parts.length>1){ name=parts[0]; var qn=parseInt(parts[1],10); if(!isNaN(qn)){ qty=qn; code=parts[2]||''; } else code=parts[1]; }
  if(qty==null && (m=name.match(/^(\d+)\s*(?:x|×|pz\.?|pezzi)?\s+(.+)$/i))){ qty=+m[1]; name=m[2]; }
  if(qty==null && (m=name.match(/^(.+?)\s+(?:x|×)\s*(\d+)$/i))){ name=m[1]; qty=+m[2]; }
  if(qty==null && (m=name.match(/^(.+?)\s+(\d+)\s*(?:pz\.?|pezzi)$/i))){ name=m[1]; qty=+m[2]; }
  name=name.trim(); if(!name) return null;
  return {name:name.charAt(0).toUpperCase()+name.slice(1), qty:qty==null?1:qty, code:(code||'').trim()};
}
function parseQuick(txt){
  var out=[], group=null;
  txt.split(/\r?\n/).forEach(function(raw){
    if(!raw.trim()) return;
    var indented=/^(\s+|[-•*·–]\s*)/.test(raw);
    var t=raw.trim();
    if(/:\s*$/.test(t)){ var g=parseLine(t.replace(/:\s*$/,'')); if(g){ group={name:g.name,code:g.code,container:true,qty:1,items:[]}; out.push(group);} return; }
    var p=parseLine(t); if(!p) return;
    if(group && indented) group.items.push(p); else { group=null; out.push(p); }
  });
  return out;
}

      if(ex){ ex.qty=(+ex.qty||0)+p.qty; if(p.code&&!ex.code) ex.code=p.code; merged++; return ex; }
      var o={id:uid('i'),name:p.name,code:p.code,qty:p.qty,comp:cid,note:''}; if(parent) o.parent=parent; data.items.push(o); added++; return o;
    }

      if(x.container){
        var box=data.items.filter(function(y){ return y.container && y.comp===cid && (y.parent||null)===(parentId||null) && norm(y.name)===norm(x.name); })[0];
        if(!box){ box={id:uid('i'),name:x.name,code:x.code,qty:1,comp:cid,note:'',container:true}; if(parentId) box.parent=parentId; data.items.push(box); added++; }
        x.items.forEach(function(y){ put(y,box.id); });
      } else put(x,parentId);
    });
    data.draft=false; closeSheet(); save();
    toast(added+' aggiunti'+(merged?', '+merged+' sommati a esistenti':''));
    if(parentId) setTimeout(function(){ selectItem(parentId); },350); else setTimeout(function(){ openComp(cid); },350);
  };
}

      else if(t==='b') val=v&&v.textContent==='1'?'VERO':'FALSO';
      else val=v?v.textContent:'';
      row[ix]=val;
    }
    var rn=+rs[a].getAttribute('r'); if(rn>0){ while(rows.length<rn-1) rows.push([]); }
    rows.push(row);
  }
  return rows;
}
function readDelimited(txt){
  txt=String(txt||'').replace(/^﻿/,'');
  var first=txt.split(/\r?\n/)[0]||'', d='\t';
  var cnt=function(ch){ return first.split(ch).length-1; };
  if(cnt('\t')===0) d=cnt(';')>=cnt(',')?';':',';
  var rows=[], row=[], f='', q=false;
  for(var i=0;i<txt.length;i++){
    var ch=txt.charAt(i);
    if(q){ if(ch==='"'){ if(txt.charAt(i+1)==='"'){ f+='"'; i++; } else q=false; } else f+=ch; continue; }
    if(ch==='"' && f===''){ q=true; continue; }
    if(ch===d){ row.push(f); f=''; continue; }
    if(ch==='\r') continue;
    if(ch==='\n'){ row.push(f); rows.push(row); row=[]; f=''; continue; }
    f+=ch;
  }
  if(f!=='' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
var IMP_COLS={
  name:/^(articolo|oggetto|oggetti|strumento|strumenti|nome|name|item|items|descrizione|description|materiale|prodotto|product)$/,
  qty:/^(quantit[aà]|qty|q\.?t[aà]|qt[aà]|pezzi|pz|n\.? ?pezzi|quantity|count|numero)$/,
  code:/^(codice( \/ n°)?|code|cod\.?|n°|nr\.?|seriale|serial|sku|matricola|numero di serie)$/,
  comp:/^(scomparto|comparto|posizione|vano|tasca|compartment|location|dove)$/,
  cont:/^(contenitore|container|astuccio|dentro)$/,
  note:/^(note|nota|notes|commento|commenti)$/,
  min:/^(scorta minima|scorta|min|minimo)$/
};
function normName(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }
/* rows (array of arrays) -> [{name,qty,code,note,min,compLabel,cont}] */
function rowsToObjects(rows){
  rows=rows.map(function(r){ return (r||[]).map(function(v){ return v==null?'':String(v).trim(); }); })
           .filter(function(r){ return r.some(function(v){ return v!==''; }); });
  if(!rows.length) return [];
  var map=null, hi=-1;
  for(var h=0;h<Math.min(rows.length,10);h++){
    var m={}, hit=0;
    rows[h].forEach(function(v,ix){ var k=normName(v); for(var key in IMP_COLS) if(m[key]==null && IMP_COLS[key].test(k)){ m[key]=ix; hit++; break; } });
    if(m.name!=null && hit>=1){ map=m; hi=h; break; }
  }
  var body=rows.slice(hi+1);
  if(!map){ /* no header: first text column = name, first numeric column = quantity */
    map={name:0};
    var r0=rows[0]; for(var c=1;c<r0.length;c++) if(/^\d+([.,]\d+)?$/.test(r0[c])){ map.qty=c; break; }
    body=rows;
  }
  var out=[];
  body.forEach(function(r){
    var name=r[map.name]||''; if(!name) return;
    var q=map.qty!=null?parseFloat(String(r[map.qty]).replace(',','.')):1; if(isNaN(q)||q<0) q=1;
    var o={name:name, qty:Math.round(q)};
    if(map.code!=null && r[map.code]) o.code=r[map.code];
    if(map.note!=null && r[map.note]) o.note=r[map.note];
    if(map.min!=null && parseInt(r[map.min],10)>0) o.min=parseInt(r[map.min],10);
    if(map.comp!=null && r[map.comp]) o.compLabel=r[map.comp];
    if(map.cont!=null && r[map.cont]){ var pp=r[map.cont].split('›'); o.cont=pp[pp.length-1].trim(); }
    out.push(o);
  });
  return out;
}

function doImport(plan,mode){
  var cs=importCompChoices(), added=0, updated=0, made=[];
  if(!cs.length && plan.some(function(p){ return !p.replace; })){ toast('Crea prima almeno uno scomparto (Building)'); return; }
  plan.forEach(function(p){
    var o=p.o;
    if(p.replace && p.target){
      var t=p.target; t.qty=o.qty; if(o.code) t.code=o.code; if(o.note) t.note=o.note; if(o.min) t.min=o.min; updated++; made.push({it:t,o:o}); return; }
    var c=null;
    if(mode==='manual') c=comp(p.comp);
    if(!c) c=compByLabel(o.compLabel);
    if(!c) c=cs[Math.floor(Math.random()*cs.length)];
    var it={id:uid('i'), name:o.name, code:o.code||'', qty:o.qty, comp:c.id, note:o.note||'', shape:'auto'};
    if(o.min) it.min=o.min;
    data.items.push(it); added++; made.push({it:it,o:o});
  });
  /* rows with a "Contenitore" column: put them inside that container, if it exists in this case */
  /* missing containers are created in the same compartment (Export List lists only the objects) */
  var boxes={};
  made.forEach(function(m){ if(!m.o.cont || m.it.parent) return;
    var k=normName(m.o.cont), box=boxes[k+'|'+m.it.comp]||null;
    if(!box) data.items.forEach(function(i){ if(!box && i.id!==m.it.id && normName(i.name)===k && (i.container || i.comp===m.it.comp)) box=i; });
    if(!box){ box={id:uid('i'), name:m.o.cont, code:'', qty:1, comp:m.it.comp, note:'', shape:'auto', container:true}; data.items.push(box); added++; }
    boxes[k+'|'+box.comp]=box;
    box.container=true; m.it.parent=box.id; m.it.comp=box.comp; delete m.it.pos; });
  closeSheet(); clearSel(); save();
  toast((added?'Importati '+added+' oggetti':'')+(added&&updated?' · ':'')+(updated?'aggiornati '+updated:'')||'Nessun oggetto importato');
}

    sheets.map(function(sh,i){ return '<sheet name="'+xesc(sh.name.replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31))+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>'; }).join('')+'</sheets></workbook>';

    sheets.map(function(_,i){ return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>'; }).join('')+
    '<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  var st='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFF8A1F"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  var files=[{name:'[Content_Types].xml',data:ct},{name:'_rels/.rels',data:rels},{name:'xl/workbook.xml',data:wb},{name:'xl/_rels/workbook.xml.rels',data:wbr},{name:'xl/styles.xml',data:st}];
  sheets.forEach(function(sh,i){
    var rows=[sh.head].concat(sh.rows), last=colName(sh.head.length-1)+rows.length;
    var x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>'+

var EXP_HEAD=['Valigia','Zona','Scomparto','Contenitore','Articolo','Codice / N°','Quantità','Scorta minima','Stato','In prestito','Note'];
function exportRows(cases){
  var rows=[];
  cases.forEach(function(cs){ withCase(cs,function(){
    var order={}; compsSorted().forEach(function(c,k){ order[c.id]=k; });
    cs.items.filter(function(i){return !i.container;}).sort(function(a,b){
      return ((order[a.comp]==null?999:order[a.comp])-(order[b.comp]==null?999:order[b.comp])) || a.name.localeCompare(b.name,'it'); })
    .forEach(function(i){ var c=comp(i.comp);
      rows.push([cs.name||'Valigia', c?zoneName(c.zone):'', c?c.label:'Senza posizione', chain(i).map(function(p){return p.name;}).join(' › '),
        i.name, i.code||'', +i.qty||0, minOf(i), isOut(i)?'FINITO':(isLow(i)?'Sotto scorta':'OK'),
        loansOf(i).map(function(l){ return l.who+(+l.qty>1?' ×'+l.qty:'')+' (dal '+fmtDate(l.date)+')'; }).join('; '), i.note||'']); });
  }); });
  return rows;
}
function saveFile(name,bytes,mime){
  try{
    if(window.claude && typeof window.claude.use==='function' && BUILD==='online'){
      return window.claude.use('downloads').then(function(dl){
        if(!dl) throw {code:'unavailable'};
        return dl.save({filename:name,data:new Blob([bytes],{type:mime})});
      }).then(function(){ toast('File pronto: '+name); },function(e){ toast(e&&e.code==='declined'?'Download annullato':'Download non disponibile qui: usa “Copia per Fogli”'); });
    }
    if(typeof NATIVE!=='undefined' && NATIVE){ var b64=''; for(var i=0;i<bytes.length;i+=0x8000) b64+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
      nativePost({type:'shareFile',name:name,b64:btoa(b64)}); return; }
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([bytes],{type:mime})); a.download=name;
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500); toast('Salvato in Download: '+name);
  }catch(e){ toast('Download non riuscito'); }
}
function exportList(){

  sheet('<div class="sh"><h2>Export List</h2><button class="x" data-close>×</button></div>'+
    '<p class="note">Una riga per articolo con valigia, zona, scomparto, contenitore, codice, quantità, scorta minima e stato.</p>'+
    (multi?'<div class="scope" style="display:flex;margin:0 0 12px" id="exScope"><button data-s="one" class="on">Solo “'+esc(data.name||'')+'”</button><button data-s="all">Tutte le valigie</button></div>':'')+
    '<div class="btns" style="margin-bottom:8px"><button class="btn pri" id="exX">📗 Scarica Excel (.xlsx)</button></div>'+
    '<div class="btns" style="margin-bottom:8px"><button class="btn" id="exG">📋 Copia per Fogli Google</button></div>'+
    '<p class="note">Fogli Google: dopo “Copia”, apri un foglio nuovo (sheets.new), clicca la cella A1 e incolla (Ctrl+V): le colonne restano separate. In alternativa importa il file Excel con File › Importa.</p>',{short:true});
  var all=false;
  if(multi) $('exScope').onclick=function(e){ var b=e.target.closest('[data-s]'); if(!b) return; all=b.dataset.s==='all'; [].forEach.call(this.children,function(x){x.classList.toggle('on',x===b);}); };

    var cs=cases(), sheets=[{name:'Materiale',head:EXP_HEAD,rows:exportRows(cs),widths:[18,11,22,22,36,14,10,13,12,26,28]}];
    if(cs.length>1) cs.forEach(function(c){ sheets.push({name:c.name||'Valigia',head:EXP_HEAD,rows:exportRows([c]),widths:[18,11,22,22,36,14,10,13,12,26,28]}); });

  };

function wireSwatches(id,set){

  org.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse' && e.button!==0) return;
    var d=e.target.closest('.oc');
    if(!d){ if(cur){ cur=null; draw(); sel={item:null,comp:null}; render3D(); } return; }   /* empty grid: deselect */
    e.preventDefault();
    var c=comp(d.dataset.cid); if(!c) return;
    /* the selected element can be resized from any side or corner; the first touch only selects it */
    var E=cur===c.id?edgeHit(d,e):{any:false}; if(e.target.closest('.rh')) E={r:true,b:true,any:true};
    if(cur!==c.id){ cur=c.id; draw(); sel={item:null,comp:c.id}; render3D(); }
    drag={c:c,E:E,x0:e.clientX,y0:e.clientY,o:{x:c.x,y:c.y,w:c.w,h:c.h},moved:false,blocked:false};
    try{ org.setPointerCapture(e.pointerId); }catch(_){}
  });
  org.addEventListener('pointermove',function(e){
    if(!drag){ var h=e.target.closest&&e.target.closest('.oc.on'); org.style.cursor=h?(edgeCursor(edgeHit(h,e))||'grab'):''; return; }
    if(lostMouse(e)){ end(); return; }
    var dx=Math.round((e.clientX-drag.x0)/cell), dy=Math.round((e.clientY-drag.y0)/cell), o=drag.o, c=drag.c, E=drag.E, t;
    if(E.any){
      t={x:o.x+(E.l?dx:0), y:o.y+(E.t?dy:0), w:o.w+(E.r?dx:0)-(E.l?dx:0), h:o.h+(E.b?dy:0)-(E.t?dy:0)};
      if(t.w<1){ if(E.l) t.x=o.x+o.w-1; t.w=1; } if(t.h<1){ if(E.t) t.y=o.y+o.h-1; t.h=1; }
    } else t={x:o.x+dx,y:o.y+dy,w:o.w,h:o.h};
    var el=org.querySelector('[data-cid="'+c.id+'"]'); if(!el) return;
    if(t.x===c.x&&t.y===c.y&&t.w===c.w&&t.h===c.h) return;
    if(fits(c,t)){ c.x=t.x; c.y=t.y; c.w=t.w; c.h=t.h; drag.moved=true; drag.blocked=false; el.classList.remove('blocked');
      el.style.left=c.x*cell+'px'; el.style.top=c.y*cell+'px'; el.style.width=c.w*cell+'px'; el.style.height=c.h*cell+'px';
      if(c.kind==='strip'){ var sm=el.querySelector('small'); if(sm) sm.textContent=plugCount(c)+' prese'; }
    } else { drag.blocked=true; el.classList.add('blocked'); }
  });
  function end(){ if(!drag) return; var m=drag.moved, bl=drag.blocked; drag=null;
    var el=org.querySelector('.oc.blocked'); if(el) el.classList.remove('blocked');
    if(bl) toast('Lì c\'è già un altro elemento o il bordo: spostalo o rimpiccioliscilo prima');
    if(m){ itemsIn(cur).forEach(function(i){ if(i.pos) delete i.pos; }); commit(); } }
  org.addEventListener('pointerup',end); org.addEventListener('pointercancel',end); org.addEventListener('lostpointercapture',end);
  draw(); sel={item:null,comp:cur}; render3D();
  setView(zone==='lid'?'back':drawerNo(zone)?zone:'high');
}
/* ---------- Organizer: move objects from one compartment (or pouch/case) to another ---------- */
function moveItems(ids,dest){
  var n=0, name='';
  ids.forEach(function(id){
    var it=item(id); if(!it) return;
    if(dest.indexOf('c:')===0){ var c=comp(dest.slice(2)); if(!c) return; it.comp=c.id; delete it.parent; name=c.label; }
    else { var ct=item(dest.slice(2)); if(!ct || ct.id===it.id || descendants(it.id).indexOf(ct)>=0) return; it.parent=ct.id; it.comp=ct.comp; name=ct.name; }
    delete it.pos; descendants(it.id).forEach(function(d){ d.comp=it.comp; delete d.pos; }); n++;
  });
  return {n:n,name:name};
}
function mover(){
  if(mode==='ro') setMode('edit');
  var picked={}, filter='';
  sheet('<div class="sh"><h2>Organizer<div class="note" style="margin:2px 0 0">Tocca gli oggetti da spostare, poi tocca lo scomparto o l\'astuccio di destinazione · su PC puoi anche trascinarli</div></h2><button class="x" data-close>×</button></div>'+
    '<div class="mvsearch"><input id="mvQ" placeholder="Filtra oggetti… es. fusibile, cavo" autocomplete="off" autocorrect="off" spellcheck="false"></div>'+
    '<div id="mvList"></div>'+
    '<div class="mvbar" id="mvBar"></div>'+
    '<div class="btns" style="margin-top:8px"><button class="btn" id="mvSet">⚙ Impostazioni e backup</button><button class="btn pri" data-close>Fine</button></div>',{form:true});
  var list=$('mvList');
  function row(it,depth){
    var f=norm(filter), match=!f || norm(it.name+' '+(it.code||'')).indexOf(f)>=0;
    var kidsHtml=it.container?kids(it.id).slice().sort(byName).map(function(k){ return row(k,depth+1); }).join(''):'';
    if(!match && !kidsHtml) return '';
    return '<div class="mvit'+(picked[it.id]?' on':'')+(match?'':' dimmed')+'" data-pick="'+it.id+'" draggable="true" style="padding-left:'+(10+depth*16)+'px">'+
      '<i class="mvchk">'+(picked[it.id]?'✓':'')+'</i><span class="nm">'+(it.container?'▣ ':'')+esc(it.name)+'</span><small>'+(it.container?fmt(pcs(descendants(it.id)))+' pz dentro':fmt(it.qty)+' pz')+'</small>'+
      (it.container?'<button class="mvin" data-dest="i:'+it.id+'" title="Metti qui dentro">⤵ dentro</button>':'')+'</div>'+kidsHtml;
  }
  function draw(){
    var st=list.parentNode?$('sheet').scrollTop:0, h='';
    zonesOf().forEach(function(z){ var cs=compsSorted().filter(function(c){ return c.zone===z; }); if(!cs.length) return;
      var zh='';
      cs.forEach(function(c){ var its=topIn(c.id).slice().sort(byName), body=its.map(function(i){ return row(i,0); }).join('');
        if(filter && !body) return;
        zh+='<div class="mvcomp" data-dest="c:'+c.id+'"><div class="mvhead" data-dest="c:'+c.id+'"><span class="dot" style="background:'+c.color+'"></span><b>'+esc(c.label)+'</b><small>'+kindName(c.kind)+' · '+fmt(pcs(itemsIn(c.id)))+' pz</small><span class="mvdrop">⤵ sposta qui</span></div>'+(body||'<div class="mvempty">vuoto</div>')+'</div>'; });
      if(zh) h+='<div class="sec">'+esc(zoneName(z))+'</div>'+zh;
    });
    var loose=data.items.filter(function(i){ return !comp(i.comp) && !(i.parent&&item(i.parent)); });
    if(loose.length) h+='<div class="sec">Senza posizione</div><div class="mvcomp">'+loose.map(function(i){ return row(i,0); }).join('')+'</div>';
    list.innerHTML=h;
    var n=Object.keys(picked).length;
    $('mvBar').innerHTML=n?'<b>'+n+' selezionat'+(n===1?'o':'i')+'</b><span>→ tocca la destinazione</span><button class="btn" id="mvClr">Annulla</button>':'';
    $('mvBar').classList.toggle('on',!!n); list.classList.toggle('picking',!!n);
    if($('mvClr')) $('mvClr').onclick=function(){ picked={}; draw(); };
    $('sheet').scrollTop=st;
  }
  function doMove(dest,ids){
    ids=ids||Object.keys(picked); if(!ids.length) return;
    var r=moveItems(ids,dest); picked={};
    if(r.n){ save(); toast('Spostat'+(r.n===1?'o':'i')+' '+r.n+' oggett'+(r.n===1?'o':'i')+' in “'+r.name+'”'); }
    else toast('Non si può mettere un astuccio dentro se stesso');
    draw();
  }
  list.addEventListener('click',function(e){
    var d=e.target.closest('.mvhead,.mvin'), p=e.target.closest('[data-pick]');   /* destinations on click: compartment header or "dentro" button */
    if(d && (Object.keys(picked).length || d.classList.contains('mvin'))){
      if(d.classList.contains('mvin') && !Object.keys(picked).length){ toast('Prima tocca gli oggetti da mettere dentro'); return; }
      doMove(d.dataset.dest); return; }
    if(p){ if(picked[p.dataset.pick]) delete picked[p.dataset.pick]; else picked[p.dataset.pick]=1; draw(); }
  });
  /* drag & drop with the mouse */
  list.addEventListener('dragstart',function(e){ var p=e.target.closest('[data-pick]'); if(!p) return; if(!picked[p.dataset.pick]){ picked={}; picked[p.dataset.pick]=1; }
    e.dataTransfer.setData('text/plain',Object.keys(picked).join(',')); e.dataTransfer.effectAllowed='move'; });
  list.addEventListener('dragover',function(e){ var d=e.target.closest('[data-dest]'); if(!d) return; e.preventDefault(); list.querySelectorAll('.drop').forEach(function(x){ x.classList.remove('drop'); }); d.classList.add('drop'); });
  list.addEventListener('dragleave',function(e){ var d=e.target.closest('[data-dest]'); if(d) d.classList.remove('drop'); });
  list.addEventListener('drop',function(e){ var d=e.target.closest('[data-dest]'); if(!d) return; e.preventDefault(); var ids=(e.dataTransfer.getData('text/plain')||'').split(',').filter(Boolean); doMove(d.dataset.dest,ids); });
  $('mvQ').addEventListener('input',function(){ filter=this.value.trim(); draw(); });
  $('mvSet').onclick=function(){ closeSheet(); setTimeout(openSettings,250); };
  draw();
}

/* moving data between the online and offline versions */
function copyText(txt,done){
  function fallback(){ var t=document.createElement('textarea'); t.value=txt; t.style.cssText='position:fixed;opacity:0;top:0'; document.body.appendChild(t); t.select();
    var ok=false; try{ ok=document.execCommand('copy'); }catch(e){} t.remove(); done(ok); }
  try{ if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){done(true);},fallback); else fallback(); }catch(e){ fallback(); }
}
function sendData(after){
  var txt=JSON.stringify(store);
  copyText(txt,function(ok){
    if(ok){ toast('Dati copiati: '+store.cases.length+' valigi'+(store.cases.length===1?'a':'e')); if(after) after(); return; }
    sheet('<div class="sh"><h2>Copia i dati</h2><button class="x" data-close>×</button></div><p class="note">Seleziona tutto il testo e copialo (Ctrl+C / Copia).</p><label class="fld"><textarea id="sdT" style="min-height:160px"></textarea></label><div class="btns"><button class="btn pri" data-close>Fatto</button></div>',{form:true});
    $('sdT').value=txt; $('sdT').select(); if(after) after();
  });
}
function mergeIn(d){
  var st=toStore(d); if(!st) return null; var add=0, upd=0, keep=0;
  st.cases.forEach(function(c){
    var ex=store.cases.filter(function(x){return x.id===c.id;})[0];
    if(!ex){ store.cases.push(c); add++; }
    else if((c.updated||0)>(ex.updated||0)){ store.cases[store.cases.indexOf(ex)]=c; upd++; }
    else keep++;
  });
  if(st.shops && (!store.shops || (st.updated||0)>(store.updated||0))) store.shops=st.shops;
  if(st.book && (!store.book || (st.bookAt||0)>(store.bookAt||0))){ store.book=st.book; store.bookAt=st.bookAt; }
  if(st.contacts){ var cc=contacts(); for(var k in st.contacts) if(!cc[k]) cc[k]=st.contacts[k]; }
  fixStore(store); data=curCase(); return {add:add,upd:upd,keep:keep};
}
function replaceAll(d){ var st=toStore(d); if(!st) return false; store=fixStore(st); data=curCase(); data.sample=false; data.draft=false; sel={item:null,comp:null}; resetCam(); save(); return true; }
function recvData(){
  if(mode==='ro') setMode('edit');
  sheet('<div class="sh"><h2>Ricevi dati</h2><button class="x" data-close>×</button></div>'+
    '<p class="note">Incolla qui i dati copiati con <b>Invia dati</b> dall\'altra versione (online, PC o iPhone). Le valigie nuove vengono aggiunte; quelle già presenti si aggiornano solo se i dati incollati sono più recenti.</p>'+
    '<label class="fld"><textarea id="rdT" style="min-height:150px" placeholder="{ … }"></textarea></label>'+
    '<label class="btn" style="display:grid;place-items:center;margin-bottom:8px">…oppure scegli un file di backup<input type="file" id="rdF" accept=".json,application/json,text/plain" style="display:none"></label>'+
    '<div class="err" id="rdE"></div><div class="btns"><button class="btn" data-close>Annulla</button><button class="btn pri" id="rdGo">Unisci</button></div>',{form:true});
  $('rdF').onchange=function(){ var f=this.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ $('rdT').value=r.result; }; r.readAsText(f); };
  setTimeout(function(){ $('rdT').focus(); },300);
  $('rdGo').onclick=function(){
    var d; try{ d=JSON.parse($('rdT').value); }catch(e){ $('rdE').textContent='Il testo non contiene dati validi.'; return; }
    var r=mergeIn(d); if(!r){ $('rdE').textContent='Dati non riconosciuti.'; return; }
    closeSheet(); sel={item:null,comp:null}; save();
    toast((r.add?r.add+' aggiunte · ':'')+(r.upd?r.upd+' aggiornate · ':'')+(r.keep?r.keep+' già aggiornate':'')||'Fatto');
  };
}
function goOnline(){
  if(BUILD==='online'){ toast('Stai già lavorando online'); return; }
  sheet('<div class="sh"><h2>🌐 Lavora online</h2><button class="x" data-close>×</button></div>'+
    '<p class="note" style="color:var(--txt);font-size:15px">Nella versione online su claude.ai gli aggiornamenti che prepara Claude arrivano subito, senza reinstallare niente.</p>'+
    '<ol class="steps"><li>Tocca <b>Copia dati e apri online</b></li><li>Nella versione online: <b>Menu › Ricevi dati</b>, incolla e premi <b>Unisci</b></li></ol>'+
    '<p class="note">Indirizzo: '+ONLINE_URL+'</p>'+
    '<div class="btns"><button class="btn" data-close>Annulla</button><a class="btn pri" id="goOn" href="'+ONLINE_URL+'" target="_blank" rel="noopener" style="display:grid;place-items:center;text-decoration:none">Copia dati e apri online</a></div>',{});
  $('goOn').addEventListener('click',function(){ sendData(); });
}
function goOffline(){
  if(BUILD!=='online'){ toast('Stai già lavorando offline'); return; }
  sheet('<div class="sh"><h2>💻 Lavora offline</h2><button class="x" data-close>×</button></div>'+
    '<p class="note" style="color:var(--txt);font-size:15px">Offline usi l\'app installata sul PC (GetOut per Windows) o sull\'iPhone: funziona senza rete e i dati restano sul dispositivo.</p>'+
    '<ol class="steps"><li>Tocca <b>Copia dati</b></li><li>Apri l\'app GetOut sul dispositivo: <b>Menu › Ricevi dati</b>, incolla e premi <b>Unisci</b></li></ol>'+
    '<div class="btns"><button class="btn" data-close>Annulla</button><button class="btn pri" id="goOff">Copia dati</button></div>',{});
  $('goOff').onclick=function(){ sendData(function(){ closeSheet(); }); };
}

/* ---------- desktop: keyboard shortcuts ---------- */
document.addEventListener('keydown',function(e){
  var t=e.target, typing=t && /INPUT|TEXTAREA|SELECT/.test(t.tagName);
  if(e.key==='Escape'){ if($('sheet').classList.contains('on')) closeSheet(); else if(typing) t.blur(); return; }
  if(typing) return;
  if(e.key==='/' || ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='f')){ e.preventDefault(); q.focus(); q.select(); }
  else if(e.key==='n' && mode!=='ro'){ e.preventDefault(); editItem(null); }
});
/* ---------- boot ---------- */
[].forEach.call($('seg').children,function(x){x.classList.toggle('on',x.dataset.tab===tab);});
renderAll();
cam.yaw=0;
if(!sel.comp) { var hadUI=null; try{hadUI=sessionStorage.getItem('valigia-ui');}catch(e){} if(!hadUI) cam=viewCam('front'); }
markViews(); applyCam(false);
if(sel.item && item(sel.item)) setTimeout(function(){ openItem(sel.item); },50);
try{sessionStorage.removeItem('valigia-ui');}catch(e){}
initCloud();
})();
</script>
